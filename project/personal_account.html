<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <link rel="stylesheet" href="styles.css">
	<link rel="stylesheet" href="personal_account.css">
</head>
<body>
    <!-- Хедер -->
    <header class="header">
        <div class="container header-container">
            <div class="logo">
                <img src="logo.png" alt="Логотип" class="logo-img"> 
            </div>
            <nav class="header-links">
                <a href="index.html">Магазин</a>
            </nav>
            <nav class="header-links">
                <a href="index.html">Каталог</a>
                <a href="cart.html">Корзина</a>
                <a href="personal_account.html" class="active">Личный кабинет</a>
            </nav>
        </div>
    </header>

    <div class="notifications-area" id="notifications-area"></div>

    <main class="container">
        <section class="orders">
          <h2>Заказы</h2>
          <table class="orders-table">
            <thead>
              <tr>
                <th>№</th>
                <th>Дата и время</th>
                <th>Состав</th>
                <th>Стоимость</th>
                <th>Доставка</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody id="orders-body">
            </tbody>
          </table>
        </section>
    
        <div class="modal" id="edit-modal">
          <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h3>Редактирование заказа</h3>
            <form id="edit-form">
              <label for="edit-name">Имя:</label>
              <input type="text" id="edit-name" name="name" required>
    
              <label for="edit-email">Email:</label>
              <input type="email" id="edit-email" name="email" required>
    
              <label for="edit-phone">Телефон:</label>
              <input type="text" id="edit-phone" name="phone" required>
    
              <label for="edit-address">Адрес доставки:</label>
              <input type="text" id="edit-address" name="address" required>
    
              <label for="edit-delivery-date">Дата доставки:</label>
              <input type="date" id="edit-delivery-date" name="delivery-date" required>
    
              <label for="edit-delivery-time">Временной интервал доставки:</label>
              <select id="edit-delivery-time" name="delivery-time" required>
                <option value="08:00-12:00">08:00 - 12:00</option>
                <option value="12:00-14:00">12:00 - 14:00</option>
                <option value="14:00-18:00">14:00 - 18:00</option>
                <option value="18:00-22:00">18:00 - 22:00</option> 
              </select>
    
              <label for="edit-comment">Комментарий к заказу:</label>
              <textarea id="edit-comment" name="comment" rows="4"></textarea>
              <label for="edit-goods">Состав заказа:</label>
              <div id="edit-goods">
              </div>
    
              <button type="submit" class="full-width-btn">Сохранить</button>
              <button type="button" class="cancel-btn full-width-btn">Отмена</button>
            </form>
          </div>
        </div>  
    
        <div class="modal" id="view-modal">
          <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="view-content"></div>
            <button class="close-btn-full">Закрыть</button>
          </div>
        </div>
    
        <div class="modal" id="delete-modal">
          <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h3>Удаление заказа</h3>
            <p>Вы уверены, что хотите удалить заказ?</p>
            <button class="confirm-btn">Да</button>
            <button class="cancel-btn">Нет</button>
          </div>
        </div>
      </main>

      <footer class="footer">
        <div class="container footer-container">
            <p>&copy; 2025 Магазин. Все права защищены.</p>
            <p>Контакты: info@example.com</p>
        </div>
    </footer>
    <script src="personal_accountScript.js"></script>
</body>
</html>
